<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل المدارس</title>
<script>
/* Startup guard: if the app script below never starts (e.g. the file was not pasted in full), explain it instead of hanging. */
window.__bootErrors = [];
window.addEventListener('error', function (e) {
  var msg = (e.message || 'خطأ') + (e.lineno ? ' (سطر ' + e.lineno + ':' + e.colno + ')' : '');
  try {
    var src = [].slice.call(document.scripts).filter(function (x) { return !x.src && x.type !== 'text/plain' && x.text.length > 5000; })[0];
    if (src && e.lineno) {
      var lines = src.text.split('\n'), start = document.documentElement.outerHTML.split('\n').findIndex(function (l) { return l.indexOf('(() => {') >= 0; });
      var cand = [lines[e.lineno - 1], lines[e.lineno - start - 1], lines[e.lineno - 2]].filter(Boolean).map(function (l) { return l.trim().slice(0, 140); });
      if (cand.length) msg += ' — ' + cand.join(' ‖ ');
    }
  } catch (x) {}
  window.__bootErrors.push(msg);
});
setTimeout(function () {
  if (window.__appStarted) return;
  var b = document.getElementById('boot'); if (!b) return;
  var errs = window.__bootErrors.slice(0, 3).join(' • ');
  b.innerHTML = '<div style="max-width:560px;padding:24px;text-align:center;line-height:1.9;font-family:Tahoma,sans-serif">'
    + '<h3 style="margin:0 0 8px">لم يكتمل تشغيل التطبيق</h3>'
    + '<p style="margin:0">غالباً لم يُنسخ ملف <b>Index</b> كاملاً إلى محرر Apps Script. يجب أن يكون آخر سطر فيه <b dir="ltr">&lt;/html&gt;</b>. '
    + 'انسخه من جديد كاملاً (الأفضل من زر Raw في GitHub)، ثم احفظ وانشر إصداراً جديداً.</p>'
    + (errs ? '<p dir="auto" style="margin:10px 0 0;font-size:12px;opacity:.8">تفاصيل الخطأ: ' + errs.replace(/</g, '&lt;') + '</p>' : '')
    + '</div>';
}, 9000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a calm sea-glass workspace. Schools sit as round badges in a grid; picking one opens a radial "orbit" where each choice blooms its children in a ring. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13302C; --muted:#5A716D; --line:#D3DFDC;
  --accent:#0D7A69; --accent-ink:#FFFFFF; --accent-soft:#D5EDE8;
  --bld:#2D679B; --bld-soft:#DCE7F2; --hr:#A9682A; --hr-soft:#F3E4D1;
  --boys:#2D679B; --boys-soft:#DCE7F2; --girls:#A9476E; --girls-soft:#F4DEE7; --mixed:#0D7A69; --mixed-soft:#D5EDE8;
  --danger:#B13838; --danger-soft:#F6DEDE; --on-tone:#FFFFFF;
  --t3:#7A4F9E; --t3-soft:#ECE2F4; --t4:#5B7A2B; --t4-soft:#E6EEDA; --t5:#B5503A; --t5-soft:#F6E0DA; --t6:#46596B; --t6-soft:#E0E6EC;
  --shadow:0 14px 34px -16px rgba(19,48,44,.30);
  --shadow-sm:0 4px 14px -8px rgba(19,48,44,.28);
  --f-display:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1918; --surface:#152321; --surface-2:#1B2C2A; --ink:#E2EDEA; --muted:#93AAA5; --line:#2A3E3B;
  --accent:#41B8A2; --accent-ink:#04201B; --accent-soft:#163C36;
  --bld:#73A8DA; --bld-soft:#1B2E43; --hr:#E1A562; --hr-soft:#3A2A18;
  --boys:#73A8DA; --boys-soft:#1B2E43; --girls:#E38CAE; --girls-soft:#3C1E2B; --mixed:#41B8A2; --mixed-soft:#163C36;
  --danger:#E57B7B; --danger-soft:#3D1D1D; --on-tone:#08201C;
  --t3:#B794DA; --t3-soft:#2E2240; --t4:#A3C46E; --t4-soft:#25301A; --t5:#E68F79; --t5-soft:#3D221B; --t6:#9FB3C6; --t6-soft:#212C36;
  --shadow:0 14px 34px -16px rgba(0,0,0,.6); --shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1918; --surface:#152321; --surface-2:#1B2C2A; --ink:#E2EDEA; --muted:#93AAA5; --line:#2A3E3B;
  --accent:#41B8A2; --accent-ink:#04201B; --accent-soft:#163C36;
  --bld:#73A8DA; --bld-soft:#1B2E43; --hr:#E1A562; --hr-soft:#3A2A18;
  --boys:#73A8DA; --boys-soft:#1B2E43; --girls:#E38CAE; --girls-soft:#3C1E2B; --mixed:#41B8A2; --mixed-soft:#163C36;
  --danger:#E57B7B; --danger-soft:#3D1D1D; --on-tone:#08201C;
  --t3:#B794DA; --t3-soft:#2E2240; --t4:#A3C46E; --t4-soft:#25301A; --t5:#E68F79; --t5-soft:#3D221B; --t6:#9FB3C6; --t6-soft:#212C36;
  --shadow:0 14px 34px -16px rgba(0,0,0,.6); --shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);
  color-scheme:dark}

html,body{height:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--accent-soft),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1280px;margin-inline:auto}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:500;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary{position:relative;isolation:isolate}
.btn.primary::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;background:conic-gradient(from var(--star-angle,0deg),transparent 0deg 300deg,var(--accent-soft) 326deg,transparent 350deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;filter:drop-shadow(0 0 3px var(--accent-soft));transition:opacity .2s}
.btn.primary:hover::after,.btn.primary:focus-visible::after{opacity:.9;animation:star-border 2.4s linear infinite}
@property --star-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes star-border{to{--star-angle:360deg}}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));margin-top:16px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .15s,background .15s}
.input:focus{border-color:var(--accent);background:var(--surface)}
textarea.input{resize:vertical;min-height:120px;line-height:1.7}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:start}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px}
.user-chip:hover{border-color:var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-family:var(--f-display);font-size:13px}
.user-chip .u-name{font-size:13px;font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px}
.menu .m-head{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .m-head b{display:block}
.menu .m-head small{color:var(--muted)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:start}
.menu button:hover{background:var(--surface-2)}
.banner{background:var(--hr-soft);color:var(--ink);font-size:13px;text-align:center;padding:6px 16px}

/* ---------- home ---------- */
.home-head{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;min-height:164px;margin-block:14px 6px;padding:clamp(22px,3vw,34px);border:1px solid color-mix(in srgb,var(--line) 72%,transparent);border-radius:22px;background:color-mix(in srgb,var(--surface) 76%,transparent)}
.home-head h1{font-size:clamp(22px,3vw,30px)}
.home-head p{margin:4px 0 0;color:var(--muted)}
.hero-rays{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:.72}
.hero-rays::before{content:"";position:absolute;inset:-50%;background:radial-gradient(ellipse at 22% 48%,color-mix(in srgb,var(--accent-soft) 72%,transparent),transparent 34%),radial-gradient(ellipse at 78% 24%,color-mix(in srgb,var(--bld-soft) 62%,transparent),transparent 38%)}
.hero-rays i{position:absolute;top:-85%;width:18%;height:270%;border-radius:50%;filter:blur(20px);transform:rotate(24deg);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent-soft) 72%,transparent) 48%,transparent)}
.hero-rays i:nth-child(1){left:16%}
.hero-rays i:nth-child(2){left:37%;width:12%;opacity:.7;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bld-soft) 70%,transparent) 50%,transparent)}
.hero-rays i:nth-child(3){right:13%;width:14%;opacity:.65}
.home-head .stats{position:relative;z-index:1}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px}
.stat b{font-family:var(--f-display);font-size:20px;display:block;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:20;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow-sm)}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;padding:12px 0;min-width:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:inherit;opacity:.7}
.chip-sep{flex:none;width:1px;background:var(--line);margin-inline:2px}
.group{padding-block:10px 18px}
.group-h{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);font-weight:500;margin-bottom:12px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.group-h .cnt{font-family:var(--f-body);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1px solid transparent;background:transparent;border-radius:18px;padding:14px 8px 12px;transition:background .2s,border-color .2s,transform .2s}
.tile:hover{background:var(--surface);border-color:var(--line);transform:translateY(-2px)}
.badge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);position:relative;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tone) 22%,transparent)}
.badge::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--tone) 35%,transparent);transition:transform .6s}
.tile:hover .badge::after{transform:rotate(60deg)}
.t-name{font-weight:600;font-size:13.5px;line-height:1.4;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.t-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px}
.empty .e-icon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

/* ---------- school / orbit ---------- */
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:16px 4px;font-size:14px}
.crumbs button{border:0;background:none;padding:4px 8px;border-radius:8px;color:var(--muted)}
.crumbs button:hover{background:var(--surface);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:4px 8px}
.crumbs .sep{color:var(--line)}
.school-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.pill span{color:var(--muted)}
.pill.tone{background:var(--tone-soft);border-color:transparent;color:var(--tone);font-weight:600}
.stage-wrap{display:flex;justify-content:center;padding-block:4px 32px}
.stage{width:100%;display:flex;justify-content:center}
.orbit{position:relative;flex:none;margin-bottom:34px}
.orbit-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.orbit-lines .ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 7}
.orbit-lines .spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
.orbit-lines line{stroke:color-mix(in srgb,var(--tone,var(--accent)) 30%,var(--line));stroke-width:1.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .6s ease-out var(--d) forwards}
.orbit.still .orbit-lines line{animation:none;stroke-dashoffset:0}
.orbit-center{position:absolute;left:50%;top:50%;width:var(--c);height:var(--c);transform:translate(-50%,-50%);border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--tone) 80%,#fff 20%),var(--tone));color:var(--on-tone);box-shadow:0 18px 40px -14px color-mix(in srgb,var(--tone) 70%,transparent),inset 0 0 0 6px color-mix(in srgb,#fff 16%,transparent);animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both;z-index:2}
.orbit.still .orbit-center{animation:none}
.orbit-center .c-name{font-family:var(--f-display);font-weight:600;line-height:1.3;font-size:var(--cf);max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
.focus-center{padding:18px 16px}
.orbit-center .c-sub{font-size:11.5px;opacity:.85}
.orbit-center .c-up{font-size:11px;opacity:.8;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.orbit-item{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);padding:0;border:0;background:none;transform:translate(-50%,-50%) translate(var(--x),var(--y));animation:fly .6s cubic-bezier(.2,.9,.3,1.18) var(--d) backwards;z-index:3}
.orbit.still .orbit-item{animation:none}
.bubble{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s;background:var(--surface);color:var(--tone);box-shadow:var(--shadow-sm),inset 0 0 0 2px color-mix(in srgb,var(--tone) 55%,transparent)}
.orbit-item.branch .bubble{background:var(--tone);color:var(--surface);box-shadow:0 10px 24px -12px var(--tone),inset 0 0 0 5px color-mix(in srgb,#fff 18%,transparent)}
.orbit-item.leaf .bubble{background:var(--tone-soft)}
.orbit-item:hover .bubble,.orbit-item:focus-visible .bubble{transform:scale(1.08)}
.orbit-item.active .bubble{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--tone)}
.o-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:calc(var(--s) * 1.9);font-size:var(--lf);font-weight:600;line-height:1.3;text-align:center;color:var(--ink);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.o-count{position:absolute;top:-2px;inset-inline-start:-2px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px var(--bg)}
.o-kind{position:absolute;bottom:-2px;inset-inline-end:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--tone);box-shadow:0 0 0 2px var(--bg),inset 0 0 0 1.5px var(--tone)}
.orbit-hint{position:absolute;left:50%;top:calc(50% + var(--c)/2 + 26px);transform:translateX(-50%);width:min(320px,90%);text-align:center;color:var(--muted);font-size:13px}
@keyframes fly{from{transform:translate(-50%,-50%) translate(0,0) scale(.2);opacity:0}to{transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1);opacity:1}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- info sheet ---------- */
.scrim{position:fixed;inset:0;z-index:58;background:color-mix(in srgb,var(--ink) 35%,transparent);animation:fade .2s both}
.sheet{position:fixed;z-index:59;top:0;bottom:0;inset-inline-start:0;width:min(560px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .3s cubic-bezier(.2,.9,.3,1) both;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 14px;background:var(--surface);border-bottom:1px solid var(--line);padding-inline-start:max(18px,env(safe-area-inset-right,0px))}
.sheet-head .s-icon{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone)}
.sheet-head h2{font-size:19px}
.sheet-head small{color:var(--muted);display:block;font-size:12.5px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-body{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.item-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item-top .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.item-top b{font-family:var(--f-display);font-weight:600;font-size:15px;flex:1;min-width:0}
.item-top .acts{display:flex;gap:2px}
.item-top .acts button{width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.item-top .acts button:hover{background:var(--surface-2);color:var(--ink)}
.item-top .acts button.del:hover{color:var(--danger);background:var(--danger-soft)}
.item-text{white-space:pre-wrap;word-break:break-word;line-height:1.85}
.item-meta{font-size:12px;color:var(--muted);margin-top:10px}
.item-img{display:block;width:100%;border-radius:12px;background:var(--surface-2);min-height:120px;object-fit:contain;max-height:420px;cursor:zoom-in;border:0;padding:0}
.item-img img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px}
.file-row{display:flex;align-items:center;gap:12px}
.ftype{width:46px;height:54px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--bld-soft);color:var(--bld);text-transform:uppercase}
.ftype.pdf{background:var(--danger-soft);color:var(--danger)}
.file-row .f-main{flex:1;min-width:0}
.file-row .f-main b{display:block;word-break:break-word;font-weight:600}
.file-row .f-main small{color:var(--muted);font-variant-numeric:tabular-nums}
.file-acts{display:flex;gap:6px;flex-wrap:wrap}
.composer{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.composer .row{display:flex;gap:8px;justify-content:flex-end}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* ---------- settings panel ---------- */
.panel{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{background:var(--surface);border-bottom:1px solid var(--line)}
.panel-head .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.panel-head h2{font-size:19px;flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.panel-body{flex:1;overflow-y:auto}
.panel-body .wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px;max-width:980px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:16px}
.card p.d{margin:0;color:var(--muted);font-size:13.5px}
.cols{display:flex;gap:6px;flex-wrap:wrap;direction:rtl}
.cols span{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.cols span i{font-style:normal;color:var(--muted);font-size:11px;margin-inline-end:4px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row-flex .field{flex:1 1 160px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.warn{color:var(--hr)}
.tree-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.tree-root{display:flex;align-items:center;gap:10px}
.tree-root .r-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:var(--surface)}
.tree{display:flex;flex-direction:column;gap:6px}
.tree .kids{margin-inline-start:22px;padding-inline-start:12px;border-inline-start:1.5px dashed var(--line);display:flex;flex-direction:column;gap:6px;margin-top:6px}
.node-row{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:5px}
.node-row .ic-pick{width:34px;height:34px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone)}
.node-row input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:6px 4px;font-weight:500}
.node-row input:focus{background:var(--surface);border-radius:8px}
.node-row .tb{width:30px;height:30px;flex:none;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.node-row .tb:hover{background:var(--surface);color:var(--ink)}
.node-row .tb.del:hover{color:var(--danger);background:var(--danger-soft)}
.node-row .leaf-tag{font-size:11px;color:var(--muted);padding-inline:6px;white-space:nowrap}
.icon-grid{display:grid;grid-template-columns:repeat(6,40px);gap:6px}
.icon-grid button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.icon-grid button:hover,.icon-grid button.on{border-color:var(--accent);color:var(--accent)}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.user-row:last-child{border-bottom:0}
.user-row .u-main{flex:1;min-width:140px}
.user-row .u-main small{color:var(--muted);display:block;font-size:12px}
.role{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface-2);border:1px solid var(--line)}
.role.admin{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- lock screen ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock-card{width:min(380px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.lock-card .brand-mark{width:84px;height:84px}
.lock-card h1{font-size:26px}
.lock-card p{margin:0;color:var(--muted)}
.dots{display:flex;gap:12px;direction:ltr;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:background .15s,transform .15s}
.dots i.f{background:var(--accent);transform:scale(1.1)}
.dots.err{animation:shake .4s}
.dots.err i{border-color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.key{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:24px;font-weight:500;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .08s,background .15s}
.key:active{transform:scale(.93);background:var(--accent-soft)}
.key.fn{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lock-msg{min-height:22px;font-size:13px;color:var(--danger)}
.setup{width:100%;display:flex;flex-direction:column;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- dialog / toast / lightbox ---------- */
.dialog{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;animation:fade .2s both}
.dialog h3{font-size:17px}
.dialog .d-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.scrim.top{z-index:70}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:fade .2s both}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(5,15,14,.88);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.lightbox .lb-bar{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px}
.focus-scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px) saturate(.5);-webkit-backdrop-filter:blur(3px) saturate(.5);animation:fade .2s both}
.focus-wrap{position:fixed;z-index:51;transform-origin:center}
.focus-wrap .orbit{margin:0}
.focus-center .c-meta{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.root-head{display:flex;align-items:center;gap:6px}
.root-head .ic-pick{width:42px;height:42px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--tone);color:var(--surface)}
.root-head input{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:16px;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;outline:none}
.root-head input:hover{border-color:var(--line)}
.root-head input:focus{border-color:var(--accent);background:var(--surface-2)}
.root-head .tb{width:32px;height:32px;flex:none;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.root-head .tb:hover{background:var(--surface-2);color:var(--ink)}
.root-head .tb.del:hover{color:var(--danger);background:var(--danger-soft)}
.swatches{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sw{width:24px;height:24px;border-radius:50%;border:0;background:var(--sw);box-shadow:0 0 0 2px var(--surface),0 0 0 3px transparent}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sw)}
.dialog.wide{width:min(600px,calc(100% - 32px))}
.ex-tree{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.ex-root{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface-2)}
.ex-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer}
.ex-row:hover{background:var(--surface)}
.ex-row input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ex-root > .ex-node > .ex-row{font-weight:600}
.ex-kids{margin-inline-start:14px;padding-inline-start:10px;border-inline-start:1.5px dashed var(--line)}
.ex-ic{display:grid;place-items:center;color:var(--tone)}
.ex-sum{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);padding-inline-start:42px}
.ex-sum .xs{background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:2px 10px;font-size:12px}
.boot{min-height:100%;display:grid;place-items:center;color:var(--muted)}
.boot .brand-mark{width:72px;height:72px;animation:spin 6s linear infinite}

@media (max-width:640px){
  .brand small{display:none}
  .user-chip .u-name{display:none}
  .user-chip{padding:4px}
  .home-head{align-items:flex-start}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .badge{width:64px;height:64px}
  .sheet{width:100%}
}
/* ---------- bulk entry & table items ---------- */
.info-table td,.info-table th{white-space:normal;vertical-align:top;padding:7px 9px;font-size:12.5px;overflow-wrap:normal;word-break:normal}
.info-table th{min-width:56px}
.info-table td:first-child,.info-table th:first-child{min-width:90px}
.ex-sum .ok{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px}
.tbl-full .tbl-body{flex:1;overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px))}
.tbl-full .info-table td,.tbl-full .info-table th{font-size:14px;padding:9px 12px}
.tbl-full .info-table th{min-width:80px}
.pdf-sheet{position:fixed;left:-20000px;top:0;width:max-content;max-width:3000px;min-width:720px;background:#fff;color:#111;padding:36px 40px;font-family:var(--f-body)}
.pdf-sheet h1{font-family:var(--f-display);font-size:24px;margin:0 0 4px;color:#0d4f45}
.pdf-sheet p{margin:0 0 18px;color:#555;font-size:14px}
.pdf-sheet table{border-collapse:collapse;font-size:14px}
.pdf-sheet th,.pdf-sheet td{border:1px solid #9fb3ae;padding:8px 12px;text-align:center;vertical-align:middle}
.pdf-sheet th{background:#e3efec;color:#13302c;font-weight:600}
.pdf-sheet td:first-child,.pdf-sheet th:first-child{text-align:start;font-weight:600;background:#f4f8f7}
.info-table th{color:var(--ink);font-size:12.5px}
.bk-tabs{display:flex;justify-content:center}
.bk-prev{display:flex;flex-direction:column;gap:12px}
.bk-sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bk-bad{color:var(--danger)}
tr.bk-row-bad td{background:var(--danger-soft)}
.bk-files select{min-width:200px;padding:6px 8px}
.bk-files td{white-space:normal;vertical-align:middle}
.bk-paste{min-height:180px;font-family:var(--f-body);direction:rtl}
.bk-progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bk-progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}

/* ---------- Excel reading settings ---------- */
.bx-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.bx-col{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface-2);min-width:0}
.bx-col.on{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft)}
.bx-col input[type=checkbox]{accent-color:var(--accent);flex:none}
.bx-letter{font-size:11px;color:var(--muted);min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.bx-name{flex:1;min-width:0;border:0;background:transparent;font-size:13px;outline:none;padding:3px 2px;border-radius:6px}
.bx-name:focus{background:var(--surface)}
.raw-grid td,.raw-grid th{font-size:12px;padding:4px 8px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.raw-grid td.hdr{background:var(--hr-soft)}
.raw-grid td.codec{background:var(--accent-soft);font-weight:600}
.raw-grid th.sel{color:var(--accent)}

/* ---------- school accounts ---------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.aud-btn.on{color:var(--accent);background:var(--accent-soft)}
.shared-from{font-size:12px;color:var(--muted);align-self:center}
.aud-row{gap:10px}
.sa-pill{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid var(--line);background:var(--surface-2)}
.sa-pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sa-pill.warn{background:var(--hr-soft);color:var(--hr);border-color:transparent}
.sa-pill.off{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.sa-table td{white-space:normal}

/* ---------- top bar extras ---------- */
.icon-btn{position:relative}
.nbadge{position:absolute;top:-7px;inset-inline-end:-7px;min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:grid;place-items:center;background:var(--danger);color:var(--surface);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface)}
.theme-fab{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px))}

/* ---------- mind map ---------- */
.mm-scroll{overflow:auto;border-radius:12px;background:var(--surface-2);padding:14px;max-height:420px}
.mm{position:relative;margin-inline:auto}
.mm svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.mm svg path{fill:none;stroke:color-mix(in srgb,var(--c) 55%,var(--line));stroke-width:2}
.mm-n{position:absolute;display:grid;place-items:center;text-align:center;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.3;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--c);overflow:hidden}
.mm-n span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mm-n.d1{background:var(--c);color:var(--surface);box-shadow:0 8px 18px -12px var(--c)}
.mm-n.d2{background:var(--cs)}
.mm-n.root{border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 12px 26px -14px var(--accent),inset 0 0 0 5px color-mix(in srgb,var(--accent-ink) 18%,transparent);font-family:var(--f-display);font-size:14px;padding:12px}
.mm-full{position:fixed;inset:0;z-index:72;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mm-full .mm-full-head{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.mm-full .mm-full-head h2{font-size:18px;flex:1;min-width:0}
.mm-full .mm-scroll{flex:1;max-height:none;border-radius:0;padding:28px}
.mm-ed{display:flex;flex-direction:column;gap:6px}
.mm-ed-row{display:flex;align-items:center;gap:6px}
.mm-ed-row .input{padding:7px 10px}
.mm-ed-row .tb{width:32px;height:32px;flex:none;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mm-ed-row .tb:hover{background:var(--surface-2);color:var(--ink)}
.mm-ed-row .tb.del:hover{color:var(--danger);background:var(--danger-soft)}
.mm-ed-kids{margin-inline-start:16px;padding-inline-start:10px;border-inline-start:1.5px dashed var(--line);display:flex;flex-direction:column;gap:6px;margin-top:6px}
.mm-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--accent))}
.mm-prev summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.mm-prev .mm-scroll{margin-top:8px;max-height:300px}

/* ---------- notes ---------- */
.item-foot{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap}
.item-foot .btns{display:flex;gap:4px;flex-wrap:wrap}
.item.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.notes-list{display:flex;flex-direction:column;gap:10px}
.note-card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:background .2s,border-color .2s}
.note-card.unread{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.note-card .n-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.note-card .n-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.note-card.unread .n-dot{background:var(--accent)}
.note-card .n-by{font-weight:600}
.note-card.unread .n-by{font-weight:700}
.note-card .n-date{color:var(--muted);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.note-card .n-where{font-size:12.5px;color:var(--muted)}
.note-card .n-where b{color:var(--ink);font-weight:600}
.note-card .n-text{white-space:pre-wrap;word-break:break-word;line-height:1.8}
.note-card.unread .n-text{font-weight:500}
.note-card .n-acts{display:flex;gap:6px;flex-wrap:wrap}
.state-pill{font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note-card.unread .state-pill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- statistics ---------- */
.st-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.st-filters .field{flex:1 1 150px}
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.st-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.st-tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.st-tile span{font-size:12.5px;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.st-table td.num,.st-table th.num{text-align:end;font-variant-numeric:tabular-nums}
.st-table td{white-space:normal}
.st-table td.barcell{width:38%;min-width:90px}
.bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);min-width:2px}
.bar.zero i{background:transparent}
.st-sec td:first-child{padding-inline-start:calc(12px + var(--lv,0) * 18px)}
.st-sec tr.lv0 td{font-weight:600}
.st-more{display:flex;justify-content:center;padding-top:6px}
.tone-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}.hero-rays i{opacity:.35}.btn.primary::after{animation:none!important}}
</style>
</head>

<script>
/* Decodes and runs the app code (see build.py for why it is encoded). */
(function () {
  var t = document.getElementById('appCode').textContent;
  t = t.split('\n').join('').split('\r').join('').split(' ').join('');
  t = t.split('-').join('+').split('_').join('/');
  while (t.length % 4) t += '=';
  var b = atob(t), u = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  var s = document.createElement('script');
  s.text = new TextDecoder().decode(u);
  document.body.appendChild(s);
})();
</script>
